scope: capability-level
scope_note: >-
  NO FABRICATION. NextRoll's MCP tools/list is OAuth-gated (HTTP 401) and no public
  tool manifest is published, so this is NOT a tool-by-tool crosswalk — no tool names
  or input schemas are invented. It binds the four capability AREAS the vendor
  publicly describes for the AdRoll MCP Server to the REST route groups and GraphQL
  root fields that back them, so the surface divergence is recorded rather than
  silently dropped. Upgrade to a per-tool crosswalk once tools/list is introspected
  with an authenticated token.
surfaces:
  openapi:
    published: false
    note: >-
      NextRoll publishes no OpenAPI/Swagger document. Probed on the API host root
      and the docs host (/openapi.json, /openapi.yaml, /swagger.json, /api-docs,
      /v1/openapi.json) — all 404 or an HTML shell. The machine-adjacent contract is
      the published Sphinx HTTP routing table (192 documented routes) at
      https://apidocs.nextroll.com/http-routingtable.html plus the per-service
      reference pages.
  rest:
    base_url: https://services.adroll.com
    route_index: https://apidocs.nextroll.com/http-routingtable.html
    documented_routes: 192
    route_groups:
      /api: 93
      /audience: 48
      /prospecting: 25
      /activate: 16
      /user-lists: 8
      /reporting: 1
      /geo: 1
  graphql:
    endpoint: https://services.adroll.com/reporting/api/v1/query
    console: https://app.adroll.com/reporting/graphiql
    introspection: gated
    introspection_note: >-
      POST of {__schema{queryType{name}}} returns HTTP 401 "Missing 'apikey' query
      parameter". The provider instead publishes the full schema reference as
      documentation — saved verbatim to graphql/nextroll-graphql-reporting-schema.md.
    schema_document: graphql/nextroll-graphql-reporting-schema.md
  mcp:
    url: https://services.adroll.com/mcp
    tools_list: gated
    tools_list_status: 401
