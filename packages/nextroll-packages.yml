third_party_packages:
  note: Community packages only — none are maintained by NextRoll. Listed for
    awareness, not endorsement.
  currency_note: >-
    Versions and dates read from registry.npmjs.org on 2026-08-14. Four of the six
    community packages last shipped between 2017 and 2019 — they wrap the pixel, not
    the API, and none has been touched since AdRoll ABM, the GraphQL Reporting API or
    the MCP server existed. The only two maintained in the last two years are
    integration-platform modules (Pipedream, Frigg), i.e. the community that actually
    calls this API today builds on iPaaS connectors rather than on a client library.
