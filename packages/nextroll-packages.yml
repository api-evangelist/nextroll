summary: >-
  NextRoll publishes NO first-party API client library in any package registry. The
  getting-started guide teaches the API with raw cURL, Python `requests`, PHP cURL and
  Node `node-fetch` snippets rather than an SDK, and for OAuth it points developers at
  generic third-party libraries (requests-oauthlib, Passport passport-oauth2). No
  `SDKs` pointer is wired in apis.yml because there is nothing first-party to point at.
