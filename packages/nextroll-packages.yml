    url: https://github.com/AdRoll/adroll-google-tag-manager
    purpose: Google Tag Manager template for AdRoll.
    kind: tag-template
    official: true
  - name: AdRoll/analytics.js-integration-adroll
    url: https://github.com/AdRoll/analytics.js-integration-adroll
    purpose: Segment analytics.js integration for AdRoll.
    kind: analytics-integration
