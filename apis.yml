- name: AdRoll ABM Activate and Playbooks API
  description: The AdRoll ABM (formerly RollWorks) activation surface — create, read
    and update playbooks, strategies, campaigns and ad groups used to run B2B
    account-based advertising programs.
  humanURL: https://apidocs.nextroll.com/guides/rollworks-playbooks.html
  baseURL: https://services.adroll.com/activate/api/v2
  tags:
  - Account Based Marketing
