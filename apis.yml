apis:
- name: NextRoll CRUD API
  description: The core REST service behind the AdRoll and AdRoll ABM dashboards. Create
    and manage organizations, advertisables, campaigns, ad groups, ads, pixels, rules,
    segments, product feeds, marketplace deals, invoices and users. JSON over HTTP
    using GET/POST/PUT/DELETE, with parameters accepted in the query string or as
    form-encoded/multipart bodies.
  humanURL: https://apidocs.nextroll.com/crud-api/index.html
  baseURL: https://services.adroll.com/api/v1
  tags:
  - Campaigns
  - Ads
  - Advertisables
  - Pixels
  - Segments
  properties:
  - type: Documentation
    url: https://apidocs.nextroll.com/crud-api/overview.html
  - type: APIReference
    url: https://apidocs.nextroll.com/crud-api/reference.html
  - type: Examples
    url: https://apidocs.nextroll.com/crud-api/examples.html
- name: NextRoll GraphQL Reporting API
  description: A single GraphQL endpoint for all AdRoll and AdRoll ABM reporting data
    — advertisable, campaign, ad group, ad, audience, email and account metrics,
    conversions, contextual targeting and CTV placements — replacing the legacy
    /report and /metrics REST endpoints of the CRUD and Prospecting APIs.
  humanURL: https://apidocs.nextroll.com/graphql-reporting-api/index.html
  baseURL: https://services.adroll.com/reporting/api/v1
  tags:
  - Reporting
  - GraphQL
  - Metrics
  - Analytics
  properties:
  - type: Documentation
    url: https://apidocs.nextroll.com/graphql-reporting-api/overview.html
  - type: APIReference
