- name: NextRoll Server-to-Server (S2S) Event API
  description: Send conversion and engagement events directly from your servers to
    complement the AdRoll pixel and Mobile Measurement Partner integrations. Accepts
    batches of up to 100 JSON events across thirteen named event types, matched to
    users by click id (adct), first-party cookie, hashed or cleartext email, mobile
    advertising id or a custom user id. Authenticated with Server Access Tokens
    (SATs) issued by an account manager.
  humanURL: https://apidocs.nextroll.com/server-to-server-api/index.html
  baseURL: https://srv.adroll.com/api
  tags:
  - Events
  - Conversions
  - Server to Server
  properties:
  - type: Documentation
    url: https://apidocs.nextroll.com/server-to-server-api/overview.html
  - type: APIReference
    url: https://apidocs.nextroll.com/server-to-server-api/reference.html
  - type: EventCatalog
    url: asyncapi/nextroll-s2s-events.yml
- name: AdRoll MCP Server
  description: NextRoll's Model Context Protocol server (open beta, launched May 2026),
    exposing supported AdRoll and AdRoll ABM data and tools to MCP-compatible AI
    clients such as Claude, ChatGPT, Cursor, n8n and Microsoft Copilot Studio.
    Supports reporting and performance analysis, draft-first campaign creation and
    selected campaign management, and ABM account intelligence. Protected by OAuth
    2.1 with PKCE (S256) and dynamic client registration; the single published scope
    is `mcp`.
  humanURL: https://www.adroll.com/blog/adroll-mcp-server
  baseURL: https://services.adroll.com/mcp
  tags:
  - MCP
  - Agents
  - AI
  - Reporting
  properties:
