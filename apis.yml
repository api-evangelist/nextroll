aid: nextroll
name: NextRoll
description: 'NextRoll, Inc. is a San Francisco-based marketing technology company
  that operates two brands on a shared machine-learning and identity platform: AdRoll,
  a cross-channel digital advertising and retargeting platform for ecommerce and D2C
  marketers, and AdRoll ABM (formerly RollWorks), an account-based marketing platform
  for B2B demand generation and sales teams. The NextRoll API is the single developer
  surface behind both brands, served from https://services.adroll.com and split into
  focused services: a REST CRUD API for organizations, advertisables, campaigns, ad
  groups, ads, pixels, segments and product feeds; a GraphQL Reporting API that
  replaces the legacy per-object report endpoints; an Audience API for CRM, custom,
  composite, lookalike and target-account segments; Prospecting, Geotargeting and
  User Lists APIs; an ABM Activate/Playbooks API; and a Server-to-Server event API
  for conversion and engagement events. Developers register applications at
  developers.nextroll.com and authenticate with OAuth 2.0 or a Personal Access Token
  plus an application API key. In May 2026 NextRoll launched the AdRoll MCP Server,
  an OAuth 2.1 protected Model Context Protocol endpoint that exposes AdRoll
  reporting, draft-first campaign creation and ABM account intelligence to AI
  assistants and agents.'
