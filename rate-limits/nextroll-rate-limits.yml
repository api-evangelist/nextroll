generated: '2026-08-01'
method: searched
source: https://apidocs.nextroll.com/guides/api-key-migration.html
docs:
- https://apidocs.nextroll.com/guides/api-key-migration.html
- https://apidocs.nextroll.com/guides/get-started.html
- https://apidocs.nextroll.com/support.html
enforcement:
  host: services.adroll.com
  note: >-
    The services.adroll.com subdomain exists specifically to enforce API keys and
    rate limiting; limits are attached to the registered application's key.
signal:
  status_code: 429
  headers: none documented
  retry_after: not documented
rate_limits:
- tier: default (new application)
  limit_count: 100
  limit_interval: day
  scope: per service, per application
  source: https://apidocs.nextroll.com/guides/get-started.html
  quote: The default quota is 100 API requests per service per day.
- tier: Basic
  limit_count: 10000
  limit_interval: day
  scope: per application
  approval_required: false
  access: all API features
  source: https://apidocs.nextroll.com/guides/api-key-migration.html
- tier: Partner
  limit_count: null
  limit_interval: day
  scope: per application
  approval_required: true
  note: >-
    Partner-tier applications must be approved before they can make API calls. No
    published quota figure.
  source: https://apidocs.nextroll.com/guides/api-key-migration.html
payload_limits:
- surface: Server-to-Server (S2S) Event API
  limit: 100 events per request
  source: https://apidocs.nextroll.com/server-to-server-api/events.html
- surface: GraphQL Reporting API
  limit: no documented limit on query size
  note: The FAQ explicitly states there is no limit on GraphQL query size and
    recommends one large query over many small ones.
  source: https://apidocs.nextroll.com/faq.html
- surface: AdRoll ABM account metrics via GraphQL
  limit: date range must not exceed 30 days per query
  source: https://apidocs.nextroll.com/guides/account-metrics.html
increase_process:
  channel: form
  url: https://docs.google.com/forms/d/e/1FAIpQLSccdzxBoB_BHfAzkjoz9tc_gCPXsniGXcgYNMFvPXMRxS17uA/viewform
  response: reviewed and answered by email
  source: https://apidocs.nextroll.com/support.html
observations:
- The two published figures conflict in scope — the getting-started guide says 100
  requests per service per day by default, the API-key migration guide says Basic
  tier gets 10,000 calls per day. Both are recorded verbatim rather than reconciled.
- No rate-limit response headers are documented, so a client cannot see remaining
  quota without hitting a 429.
